name: Decode hero JPEG
on:
  push:
    paths:
      - 'cpm-intensive-hero-email-600.jpg.b64'
  workflow_dispatch:
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode and commit JPEG
        run: |
          base64 -d cpm-intensive-hero-email-600.jpg.b64 > cpm-intensive-hero-email-600.jpg
          file cpm-intensive-hero-email-600.jpg
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cpm-intensive-hero-email-600.jpg
          git commit -m "Add decoded CPM Intensive hero JPEG" || echo "No changes"
          git push
