name: Fetch hero JPEG
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/decode-hero-jpeg.yml'
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download JPEG and commit
        run: |
          curl -fsSL -o cpm-intensive-hero-email-600.jpg https://i.imgur.com/fkMPM1I.jpeg
          file cpm-intensive-hero-email-600.jpg
          ls -la cpm-intensive-hero-email-600.jpg
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cpm-intensive-hero-email-600.jpg
          git commit -m "Add CPM Intensive hero JPEG for Resend broadcast" || echo "No changes"
          git push
